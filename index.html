<!-- 작성: AI 초안 (claude-opus-5-5, 2026-11-12, R08 2026-11-13) / 검토: 미검토
     R08: 질문은 files/질문트리/03_코드북.md(장면)·03b_까닭_코드북.md(까닭·다음)에서만 가져온다
     기록앱 R04 = B 방식(설치형 웹 앱). 화면은 R03과 같고 저장만 바뀜
     저장: 먼저 휴대폰에 보관 → 구글 시트(Apps Script)로 보냄 → 성공하면 보관함에서 지움. 같은 id는 시트가 한 번만 적음
     첫 실행: 비밀번호 입력(시트 쪽 스크립트 속성 PASSWORD 와 맞아야 함). 비밀번호는 이 코드에 없다
     분류 항목은 가안. 기준표(FIFA 리포트 등)가 나오면 교체 -->
<style>
/* 한 줄 세로 흐름: 휴대폰 한 손 조작, 큰 버튼, 단계마다 한 질문 */
:root{
  --bg:#F3F6FA; --card:#FFFFFF; --ink:#1C2733; --muted:#66727F; --line:#DFE5EC;
  --accent:#3B7BC8;--grass:#E3F1E8;--chalk:#FFFFFF; --accent-ink:#FFFFFF; --accent-soft:#E6EFFA;
  --good:#2C8F62; --good-soft:#E3F3EB; --bad:#C9673F; --bad-soft:#F8E9E2; --warn:#9A6300; --warn-soft:#FFF3D6;
  --f-body:'Pretendard',-apple-system,'Apple SD Gothic Neo',system-ui,-apple-system,sans-serif; --f-head:'Pretendard',-apple-system,'Apple SD Gothic Neo',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141A21; --card:#1D252E; --ink:#E8EDF2; --muted:#9AA6B2; --line:#2E3946;
  --accent:#6AA3E6;--grass:#1E3328;--chalk:#CFE3D6; --accent-ink:#0E1620; --accent-soft:#22324A;
  --good:#5CC292; --good-soft:#1E3329; --bad:#E49470; --bad-soft:#3A271F; --warn:#F0C060; --warn-soft:#3A3120; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:480px;margin:0 auto;padding-block:max(14px, env(safe-area-inset-top, 0px)) 0;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:12px;min-height:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top b{font-family:var(--f-head);font-size:17px}
.top .date{font-size:13px;color:var(--muted)}
.dots{display:flex;gap:5px}
.dots i{width:20px;height:5px;border-radius:5px;background:var(--line)}
.dots i.on{background:var(--accent)}
.crumb{display:flex;flex-wrap:nowrap;gap:6px;min-height:26px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.crumb::-webkit-scrollbar{display:none}.crumb span{flex:0 0 auto;white-space:nowrap}
.crumb span{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.q{font-family:var(--f-head);font-size:22px;font-weight:700;margin:4px 0 0;text-wrap:balance}
.qs{font-size:14px;color:var(--muted);margin:2px 0 6px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{width:100%;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px 16px;text-align:left;font:inherit;font-size:18px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:56px;transition:transform .08s}
.opt:active{transform:scale(.97)}
.opt small{display:block;font-size:14px;margin-top:2px;color:var(--muted);font-weight:500}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.none{border-style:dashed;color:var(--muted);font-size:16px;font-weight:600;min-height:50px}
.opt.good{border-color:var(--good)}
.opt.bad{border-color:var(--bad)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opts.g2 .opt{min-height:76px;padding:12px 14px}.opts.g2 .opt>span:last-child{display:none}.opts.g2 .opt.none{grid-column:1/-1;min-height:50px}
.cond{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cond .opt{justify-content:center;padding:0;font-size:22px;min-height:60px}
.opts.dense{gap:6px}.opts.dense .opt{min-height:48px;padding:10px 16px}.opts.dense .opt.none{min-height:44px}
.score{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.score .opt{justify-content:center;padding:0;font-size:20px;min-height:56px}
.lbl{font-size:13.5px;font-weight:700;color:var(--muted);margin:0}
.sentence{background:var(--accent-soft);border-radius:16px;padding:12px 16px;font-size:18px;font-weight:700;line-height:1.6;color:var(--ink)}
.feel input{width:100%;accent-color:var(--accent);height:44px;-webkit-appearance:none;appearance:none;background:transparent}
.feel input::-webkit-slider-runnable-track{height:10px;border-radius:10px;background:var(--line)}
.feel input::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:var(--accent);border:3px solid var(--card);box-shadow:0 1px 4px rgba(0,0,0,.25);margin-top:-12px}
.feel input::-moz-range-track{height:10px;border-radius:10px;background:var(--line)}
.feel input::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--accent);border:3px solid var(--card)}
.feel input.untouched{opacity:.4}
.ends{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);font-weight:700}
.fv{margin:2px 0 0;text-align:center;font-family:var(--f-head);font-size:22px;font-weight:700}

.btn.back{background:var(--line);color:var(--ink);flex:0 0 96px}

.done{text-align:center;font-size:44px;line-height:1;margin:6px 0 0}
.state{font-size:15px;border-radius:12px;padding:12px 14px;margin:0}
.state.ok{background:var(--good-soft);color:var(--good)}
.state.warn{background:var(--warn-soft);color:var(--warn)}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px}
/* 끝 화면 요약: 이름표는 작게, 값은 크게 (R07) */
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;text-align:center}
.stat span{display:block;font-size:13px;color:var(--muted);font-weight:700}
.stat b{display:block;font-size:22px;font-weight:700;margin-top:2px}
.item .m{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
input.pw{width:100%;font:inherit;font-size:20px;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);letter-spacing:.1em}
.err{color:var(--bad);font-size:14px;font-weight:700;min-height:22px;margin:0}
/* 시작 화면 (R06): 하루 첫 실행 때 약 1.3초, 누르면 바로 넘어감 */
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .25s}
#splash.out{opacity:0;pointer-events:none}
#splash svg{width:min(78vw,300px)}
#splash .st{font-size:26px;font-weight:700;letter-spacing:-.5px;margin:22px 0 0;opacity:0;transform:translateY(8px);animation:spUp .45s .75s ease-out forwards}
#splash .ss{font-size:14px;color:var(--muted);margin:6px 0 0;opacity:0;animation:spUp .45s .85s ease-out forwards}
#splash .dr{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:spDraw var(--d) var(--t) ease-out forwards}
#splash .ball{transform:translate(-160px,0) rotate(-360deg);transform-origin:150px 100px;animation:spRoll .55s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes spUp{to{opacity:1;transform:none}}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spRoll{to{transform:none}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}
/* R11: 고른 보기는 진한 색 + ✓, 「다음」은 보기 바로 아래 */
.opt.sel{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.opt.sel small{color:var(--accent-ink);opacity:.9}
.opt.good.sel{border-color:var(--good);background:var(--good);color:#fff}
.opt.bad.sel{border-color:var(--bad);background:var(--bad);color:#fff}
.opt.none.sel{border-style:solid;color:var(--accent-ink)}
.ck{font-size:18px;font-weight:700;flex:0 0 auto;margin-left:6px}
.num{font-size:22px;font-weight:700;flex:0 0 auto}
.opts.g2 .opt{position:relative}.opts.g2 .opt .num{position:absolute;top:6px;right:10px}.opts.g2 .opt>span:first-child,.opts.g2 .opt>span.num{display:block}
.nextbtn{width:100%;flex:none;margin-top:4px}
.btn.back.wide{width:100%;flex:none}
.crumb span{background:var(--accent);color:var(--accent-ink)}
.crumb .seq{background:var(--ink);color:var(--bg)}
/* R12 주간 기록 카드: 칸이 차례로 차고, 오늘 칸이 튀어 오른다 */
.wk{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;text-align:center}
.wk-t{margin:0;font-size:15px;font-weight:700;color:var(--muted)}.wk-t b{font-size:28px;color:var(--good);margin:0 2px;font-variant-numeric:tabular-nums}
.wk-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0 6px}
.wk-c{display:flex;flex-direction:column;align-items:center;gap:3px}.wk-c small{font-size:12px;color:var(--muted);font-weight:700}
.wk-d{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:16px}
.wk-d.on{background:var(--good);border-color:var(--good)}
.wk-d.fut{border-style:dashed;opacity:.5}
.wk-m{margin:0;font-size:16px;font-weight:700;color:var(--ink)}
.wk.anim .wk-d.on{animation:wkPop .45s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i)*.12s + .2s)}
.wk.anim .wk-d.now{animation:wkPop .55s cubic-bezier(.3,1.6,.5,1) both,wkRing 1.2s 1.2s ease-out 2;animation-delay:calc(var(--i)*.12s + .35s),calc(var(--i)*.12s + .9s)}
.wk.anim .wk-m{animation:wkUp .5s ease-out both;animation-delay:1.3s}
@keyframes wkPop{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes wkRing{0%{box-shadow:0 0 0 0 rgba(44,143,98,.55)}100%{box-shadow:0 0 0 14px rgba(44,143,98,0)}}
@keyframes wkUp{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.wk.anim *{animation:none!important}}
.wk-mini{font-size:13.5px;font-weight:700;color:var(--good);margin:0}
.pk{color:var(--accent);font-weight:700;letter-spacing:.02em}.pk.good{color:var(--good)}.pk.bad{color:var(--bad)}
.sentence{font-weight:500}.item{line-height:1.6}
</style>

<body>
<div class="wrap" id="app"><div class="top"><b>오늘의 장면 기록</b></div><p class="qs">불러오는 중…</p></div>
<script>
// ===== 설정: 아버지가 구글 스크립트를 배포한 뒤 받은 주소를 넣는다 =====
const ENDPOINT='https://script.google.com/macros/s/AKfycbylTiq7UfS83xCoZvA-_71Io9rwS29PfuExHS-wjzP4xp06jhECu57CO8G1Kz69C2nKbg/exec';
const APP='R15';

// 장면 트리: files/질문트리/03_코드북.md (반복 1, 2026-11-13)
const TREE=[
 {k:'자리 잡기',d:'공이 멀리 있을 때 위치·간격 맞추기',ch:['수비 라인 높이 맞추기','동료와 공 쪽으로 좁히기','미드필드와 수비 사이 공간 막기','뒷공간 막을 준비','나간 동료 뒤 채우기(커버)','우리 공격 중 역습 대비']},
 {k:'직접 막기',d:'공 가진 상대·공중볼과 맞붙기',ch:['앞으로 나가 압박하기','1대1 수비','공중볼·세컨볼','박스 안·크로스 수비']},
 {k:'뺏긴 직후',d:'공을 뺏긴 바로 뒤',ch:['바로 다시 뺏기','상대 역습 늦추기','수비 자리로 돌아가기']},
 {k:'연계 플레이',d:'우리 공일 때 패스·움직임',ch:['압박 벗어나기','앞으로 패스 넣기','패스 받을 각도 만들기','상대를 따라오게 해 공간 만들기','뺏은 뒤 첫 패스']}
];
// 까닭 6갈래: files/질문트리/03b_까닭_코드북.md §1 (보기 문구, 문장 속 문구)
const WHY=[
 {k:'보기',good:['주변을 미리 봐 둔 것','주변을 미리 봐 두어서'],bad:['주변을 늦게 본 것','주변을 늦게 봐서']},
 {k:'위치',good:['서 있던 자리가 좋았던 것','서 있던 자리가 좋아서'],bad:['서 있던 자리가 안 맞았던 것','서 있던 자리가 안 맞아서']},
 {k:'때',good:['움직이는 타이밍이 맞은 것','움직이는 타이밍이 맞아서'],bad:['움직이는 타이밍이 빠르거나 늦은 것','움직이는 타이밍이 빠르거나 늦어서']},
 {k:'소통',good:['동료와 콜이 맞은 것','동료와 콜이 맞아서'],bad:['동료와 콜이 없거나 엇갈린 것','동료와 콜이 없거나 엇갈려서']},
 {k:'실행',good:['몸 방향·첫 터치가 좋았던 것','몸 방향·첫 터치가 좋아서'],bad:['몸 방향·첫 터치가 흔들린 것','몸 방향·첫 터치가 흔들려서']},
 {k:'상대',good:['상대 움직임을 먼저 읽은 것','상대 움직임을 먼저 읽어서'],bad:['상대가 더 잘한 것','상대가 더 잘해서']}
];
// 다음에 해 볼 것: 03b §2 (보기 문구, 문장 속 문구)
const NEXT={보기:['공 오기 전에 고개 돌려 주변 보기','공 오기 전에 고개를 돌려 주변을 본다'],위치:['공과 상대 위치 보고 자리 먼저 잡기','공과 상대 위치를 보고 자리를 먼저 잡는다'],
 때:['언제 움직일지(타이밍) 미리 정해 두기','언제 움직일지 미리 정해 둔다'],소통:['동료에게 먼저 콜하기','동료에게 먼저 콜한다'],
 실행:['몸 방향 열고 첫 터치 연습하기','몸 방향을 열고 첫 터치를 연습한다'],유지:['오늘처럼 그대로 하기','오늘처럼 그대로 한다']};
const NONE='여기에 없음';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const todayKo=()=>{const d=new Date();return `${d.getMonth()+1}월 ${d.getDate()}일`;};
const uid=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);

// ===== 휴대폰 보관 (보관함 = 아직 못 보낸 기록, 최근 = 지난 기록 5개, 비밀번호) =====
const K={q:'scene_queue_v1',recent:'scene_recent_v1',pw:'scene_pw_v1',days:'scene_days_v1'};
// ===== 주간 기록 (R12, 2026-11-13): 기록한 날을 이 휴대폰에 모아 이번 주(월~일) 며칠, 며칠 연속인지 보여 준다 =====
// 끊긴 날을 탓하는 문구는 쓰지 않는다 (CLAUDE.md 규칙, Greenlees W041)
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function dayList(){const a=new Set(lsGet(K.days,[]));lsGet(K.recent,[]).forEach(r=>r&&r.date&&a.add(r.date));return a;}
function addDay(){const a=dayList();a.add(today());lsSet(K.days,[...a].sort().slice(-400));}
function weekInfo(){
 const have=dayList(), now=new Date(); now.setHours(12,0,0,0);
 const mon=new Date(now); mon.setDate(now.getDate()-((now.getDay()+6)%7));
 const days=[...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);const k=ymd(d);return {k,on:have.has(k),today:k===ymd(now),future:d>now};});
 let streak=0; const c=new Date(now); while(have.has(ymd(c))){streak++;c.setDate(c.getDate()-1);}
 return {days,count:days.filter(d=>d.on).length,streak};
}
function weekCard(anim){const w=weekInfo();const L=['월','화','수','목','금','토','일'];

function countUp(){const el=document.querySelector('.wk.anim .wk-n');if(!el)return;const n=+el.dataset.n;

const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};

// ===== 보내기 =====
async function post(body){
 const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});

}
let flushing=false;
async function flush(){
 if(flushing)return null; const q=lsGet(K.q,[]); const pw=lsGet(K.pw,null);
 if(!q.length||!pw||ENDPOINT.startsWith('__'))return null;
 flushing=true;
 try{
  const res=await post({pw,recs:q.slice(0,50)});
  if(res&&res.ok){const sent=new Set(res.ids||[]);lsSet(K.q,lsGet(K.q,[]).filter(r=>!sent.has(r.id)));return {ok:true};}
  if(res&&res.err==='bad_password'){try{localStorage.removeItem(K.pw)}catch(e){};return {ok:false,pw:true};}

// - 모든 고르기 화면: 누르면 색이 칠해지고(✓), 보기 바로 아래 「다음」을 눌러야 넘어간다

let S,t0,saveState=null;
function sceneFields(){return {big:null,mid:null,res:null,why:null,next:null,match:null,times:{},mids:{},whys:{},nones:[],noneText:{},noneOpen:null,pickMid:null,pickRes:null,pickWhy:null,pickNext:null,saved:null};}
function fresh(){S=Object.assign({step:0,kind:null,score:null,bigs:[],seq:[],pos:0,doneList:[],extra:false,order:shuffle(TREE.map(t=>t.k))},sceneFields());t0=performance.now();saveState=null;}
fresh();

const T=x=>x;
function whyObj(){return WHY.find(w=>w.k===S.why);}
function nextOrder(){ // 03b §2: 잘됨이면 「그대로」 맨 위, 고른 까닭의 짝 다음, 상대를 고르면 바꿀 수 있는 것만
 const five=['보기','위치','때','소통','실행'];
 if(S.why==='상대')return S.res==='good'?['유지',...five]:five;
 const first=S.res==='good'?['유지']:[]; const pair=S.why&&five.includes(S.why)?[S.why]:[];
 return [...first,...pair,...five.filter(k=>!pair.includes(k))].filter((k,i,a)=>a.indexOf(k)===i);
}
// R13: 고른 말에 표시(\u0001…\u0002, 잘됨 \u0003, 아쉬움 \u0004)를 달아 화면에서는 굵은 색 글씨로, 시트에는 표시 없이 보낸다
const PK='\u0001',PE='\u0002',PG='\u0003',PB='\u0004';

 const k=x=>PK+x+PE;

 const res=S.res==='good'?PG+'잘됐다'+PE+'.':PB+'아쉬웠다'+PE+'.';
 const w=whyObj();
 const main=w?`${when} ${scene} ${k(w[S.res][1])} ${res}`:nt['까닭']?`${when} ${scene} ${res} 까닭: ${k('「'+nt['까닭']+'」')}.`:`${when} ${scene} ${res}`;
 const nx=S.next&&NEXT[S.next]?` 다음에는 ${k(NEXT[S.next][1])}.`:nt['다음']?` 다음에는 ${k('「'+nt['다음']+'」')}.`:'';
 return main+nx;
}
const plain=m=>String(m||'').replace(/[\u0001-\u0004]/g,'');

let soft=false; // 같은 화면에서 고르기만 바꿀 때: 누름 막기를 걸지 않는다
function tap(fn){soft=true;fn();render();soft=false;}
function render(){
 if(!lsGet(K.pw,null))return renderPw();

 if(st===0){const wi=weekInfo();P(`${wi.count?`<p class="wk-mini">이번 주 ${wi.count}일 기록${wi.streak>=2?` · ${wi.streak}일 연속`:''}</p>`:''}<p class="q">오늘(${todayKo()})은 경기인가, 훈련인가?</p>

  ${(()=>{const i=S.bigs.indexOf(NONE);return `<button class="opt none${sel(i>=0)}" onclick="tap(()=>toggleBig(NONE))">${NONE}${i>=0?` <span class="num">${circled(i)}</span>`:''}</button>`;})()}</div>
  ${nextBtn(S.bigs.length,"startSeq()",S.bigs.length>1?`${S.bigs.length}개 장면 시작`:'다음')}`,S.extra?'':back(0));return;}

   ${nextBtn(S.pickRes,"doneRes()")}`,`<button class="btn back" onclick="backFrom3()">← 뒤로</button>`);return;}

   <div class="opts ${o.length>5?'dense':''}">${o.map(k=>{const w=WHY.find(x=>x.k===k);return `<button class="opt ${S.res}${sel(S.pickWhy===k)}" onclick="tap(()=>S.pickWhy='${k}')">${w[S.res][0]}${S.pickWhy===k?chk:''}</button>`;}).join('')}
   <button class="opt none${sel(S.pickWhy===NONE)}" onclick="tap(()=>S.pickWhy=NONE)">${NONE}${S.pickWhy===NONE?chk:''}</button></div>

  <button class="opt none${sel(S.pickNext===NONE)}" onclick="tap(()=>S.pickNext=NONE)">${NONE}${S.pickNext===NONE?chk:''}</button></div>

function stateLine(){return saveState==='ok'?`<p class="state ok">✅ 보냈다. 아빠 기록장에 추가됐다.</p>`:saveState==='saving'?`<p class="state warn">이 휴대폰에 보관했다. 아빠에게 보내는 중…</p>`:saveState?`<p class="state warn">${esc(saveState)}</p>`:'';}

// ----- 고르기 처리 -----
function toggleBig(k){const i=S.bigs.indexOf(k);if(i>=0)S.bigs.splice(i,1);else S.bigs.push(k);}
function startSeq(){if(!S.bigs.length)return;mark('대분류');S.seq=S.bigs.slice();S.pos=0;openScene();}
function openScene(){const k=S.seq[S.pos];Object.assign(S,sceneFields());t0=performance.now();
 if(k===NONE){S.big=null;S.nones=['대분류'];S.step=3;S.noneOpen='대분류';render();}else{S.big=k;go(2);}}
function doneMid(){const v=S.pickMid;if(!v)return;
 if(v===NONE){S.mid=null;S.noneOpen='중분류';render();return;}
 S.nones=S.nones.filter(x=>x!=='중분류');delete S.noneText['중분류'];S.mid=v;mark('중분류');go(3);}
function doneRes(){if(!S.pickRes)return;if(S.res!==S.pickRes){S.why=null;S.pickWhy=null;S.next=null;S.pickNext=null;}S.res=S.pickRes;mark('잘됨·아쉬움');go(4);}
function backFrom3(){if(S.big)go(2);else{S.noneOpen='대분류';render();}}
function doneWhy(){const v=S.pickWhy;if(!v)return;
 if(v===NONE){S.why=null;S.noneOpen='까닭';render();return;}
 S.nones=S.nones.filter(x=>x!=='까닭');delete S.noneText['까닭'];S.why=v;if(S.pickNext&&!nextOrder().includes(S.pickNext))S.pickNext=null;mark('까닭');go(5);}
function doneNext(){const v=S.pickNext;if(!v)return;
 if(v===NONE){S.next=null;S.noneOpen='다음';render();return;}
 S.nones=S.nones.filter(x=>x!=='다음');delete S.noneText['다음'];S.next=v;mark('다음');go(6);}
function nextScene(){S.pos++;saveState=null;openScene();}
function finishDay(){mark('끝');exStart();}
// ===== R15 시안: 「오늘 더 남길 것」 (일기 비교 2026-11-13) =====
// 주소 끝 ?mode=A : 항목마다 「남길까?」 예/아니오 → 예면 그 항목
// 주소 끝 ?mode=B : 한 화면에서 여러 개 고르기 → 고른 것만 차례로 (기본)
const MODE='B'; // 사용자 결정 2026-11-13: 한 화면에서 고르기 (A안 시안은 기록앱_R15시안.html ?mode=A)
const EXTRA=[
 {k:'몸 상태',ask:'오늘 몸 상태는?',type:'pick',opts:['좋음','보통','무거움','아픈 곳 있음']},
 {k:'포지션',ask:'오늘 선 자리는?',type:'pick',opts:['센터백','수비형 미드필더','기타']},
 {k:'기본기 훈련',ask:'오늘 기본기 훈련은?',type:'pick+text',opts:['잘됨','아쉬움'],ph:'예: 패턴 패스가 어제보다 잘됐다'},
 {k:'팀·동료',ask:'팀·동료와 있었던 일은?',type:'text',ph:'예: 이름을 몰라 콜을 못 했다'},
 {k:'오늘 한 줄',ask:'오늘 한 줄',type:'text',ph:'예: 미드필더 움직임을 더 알고 싶다'}
];
function exStart(){S.ex={sel:[],seq:[],pos:0,askI:0,ans:{},yn:null,pick:null};S.step=9;render();}
function exItem(){return EXTRA.find(e=>e.k===S.ex.seq[S.ex.pos]);}
function exToggle(k){const a=S.ex.sel;if(k==='없음'){S.ex.sel=a.includes('없음')?[]:['없음'];return;}S.ex.sel=a.filter(x=>x!=='없음');const i=S.ex.sel.indexOf(k);if(i>=0)S.ex.sel.splice(i,1);else S.ex.sel.push(k);}
function exMenuNext(){const sel=S.ex.sel.filter(x=>x!=='없음');mark('더 남길 것');if(!sel.length)return exFinish();S.ex.seq=EXTRA.map(e=>e.k).filter(k=>sel.includes(k));S.ex.pos=0;S.ex.pick=null;go(10);}
function exYN(){const e=EXTRA[S.ex.askI];mark('남길까 '+e.k);if(S.ex.yn==='예'){S.ex.seq=[e.k];S.ex.pos=0;S.ex.pick=null;S.ex.yn=null;go(10);}else{S.ex.yn=null;exAskNext();}}
function exAskNext(){S.ex.askI++;if(S.ex.askI>=EXTRA.length)return exFinish();go(9);}
function exItemNext(){const e=exItem();const t=document.getElementById('xt');const v={};if(S.ex.pick)v.pick=S.ex.pick;if(t&&t.value.trim())v.text=t.value.trim();S.ex.ans[e.k]=v;mark(e.k);S.ex.pick=null;S.ex.draft='';
 if(MODE==='A'){exAskNext();return;}
 S.ex.pos++;if(S.ex.pos>=S.ex.seq.length)return exFinish();go(10);}
function exFinish(){const ans=S.ex.ans;if(Object.keys(ans).length){const j=v=>v?[v.pick,v.text].filter(Boolean).join(' / '):'';
  const rec={id:uid(),app:APP,date:today(),createdAt:Date.now(),kind:S.kind,score:S.score,type:'하루',cond:j(ans['몸 상태']),position:j(ans['포지션']),basic:j(ans['기본기 훈련']),team:j(ans['팀·동료']),oneline:j(ans['오늘 한 줄']),times:S.times,sentence:'(오늘 더 남길 것)'};
  lsSet(K.q,[...lsGet(K.q,[]),rec]);flush();}
 S.step=8;render();}
function renderEx(){const st=S.step,P=(i,f)=>{page(i,f);if(soft)lockUntil=0;};
 if(st===9&&MODE==='B'){P(`<p class="q">오늘 더 남길 것은?</p><p class="qs">있으면 모두 고른다. 없으면 「없음」</p>
  <div class="opts g2">${EXTRA.map(e=>{const i=S.ex.sel.indexOf(e.k);return `<button class="opt${sel(i>=0)}" onclick="tap(()=>exToggle('${e.k}'))"><span>${e.k}</span>${i>=0?`<span class="num">${circled(i)}</span>`:''}</button>`;}).join('')}
  <button class="opt none${sel(S.ex.sel.includes('없음'))}" onclick="tap(()=>exToggle('없음'))">없음${S.ex.sel.includes('없음')?chk:''}</button></div>
  ${nextBtn(S.ex.sel.length,'exMenuNext()',S.ex.sel.filter(x=>x!=='없음').length>1?`${S.ex.sel.length}개 남기기`:'다음')}`,'');return;}
 if(st===9&&MODE==='A'){const e=EXTRA[S.ex.askI];P(`<p class="qs">오늘 더 남길 것 ${S.ex.askI+1}/${EXTRA.length}</p><p class="q"><b class="pk">${e.k}</b>도 남길까?</p>
  <div class="row2">${['예','아니오'].map(y=>`<button class="opt${sel(S.ex.yn===y)}" style="justify-content:center" onclick="tap(()=>S.ex.yn='${y}')">${y}${S.ex.yn===y?chk:''}</button>`).join('')}</div>
  ${nextBtn(S.ex.yn,'exYN()')}`,'');return;}
 if(st===10){const e=exItem();const n=S.ex.seq.length;
  P(`${MODE==='B'&&n>1?`<p class="qs">${S.ex.pos+1}/${n}</p>`:''}<p class="q">${e.ask}</p>
  ${e.opts?`<div class="opts">${e.opts.map(o=>`<button class="opt${sel(S.ex.pick===o)}" onclick="tap(()=>S.ex.pick='${o}')">${o}${S.ex.pick===o?chk:''}</button>`).join('')}</div>`:''}
  ${e.type!=='pick'?`<input class="pw" id="xt" maxlength="80" autocomplete="off" placeholder="${e.ph}" value="${esc(S.ex.draft||'')}" oninput="S.ex.draft=this.value" aria-label="짧게 적기"><p class="qs" style="margin:0">비워 두고 넘어가도 된다</p>`:''}
  ${nextBtn(e.type==='text'||S.ex.pick,'exItemNext()')}`,'');return;}
}

function oneMore(){S.extra=true;S.bigs=[];S.seq=[];S.pos=0;Object.assign(S,sceneFields());saveState=null;go(1);}

// 「여기에 없음」을 고르고 「다음」을 누르면 짧게 적는 화면 (목적 ②). 비워도 넘어간다
function renderNone(){const w=S.noneOpen;
 const ask={대분류:'어떤 장면이었나?',중분류:'어떤 장면이었나?',까닭:'까닭은 무엇이었나?',다음:S.kind==='경기'?'다음 경기에서 할 행동은?':'다음에 할 행동은?'}[w];
 page(`<p class="q">${ask}</p><p class="qs">짧게 적는다. 비워 두고 넘어가도 된다</p>
 <input class="pw" id="nt" maxlength="40" autocomplete="off" placeholder="${{대분류:'예: 코너킥 수비',중분류:'예: 코너킥 수비',까닭:'예: 공이 미끄러웠다',다음:'예: 스터드 바꾸기'}[w]||''}" value="${esc(S.noneText[w]||'')}" aria-label="짧게 적기">
 ${nextBtn(true,'noneDone()')}`,
 w==='대분류'&&(S.pos>0||S.extra)?'':`<button class="btn back" onclick="noneBack()">← 뒤로</button>`);
 setTimeout(()=>{const i=document.getElementById('nt');if(i)i.focus();},60);}
function noneBack(){const w=S.noneOpen;S.noneOpen=null;if(w==='대분류'){S.step=1;}render();}
function noneDone(){const w=S.noneOpen;const v=(document.getElementById('nt').value||'').trim();
 if(v)S.noneText[w]=v;else delete S.noneText[w];
 if(!S.nones.includes(w))S.nones.push(w);mark(w+'(없음)');S.noneOpen=null;
 if(w==='대분류'||w==='중분류'){go(3);}else if(w==='까닭'){go(5);}else{go(6);}}

async function save(){
 if(S.step!==6||S.saved||!S.match)return; // 두 번 눌러도 한 번만
 mark('문장 확인');
 const w=whyObj();
 const rec={id:uid(),app:APP,date:today(),createdAt:Date.now(),kind:S.kind,score:S.score,big:S.big,mid:S.mid,res:S.res,
  why:w?w[S.res][0]:null,whyKey:S.why,next:S.next?NEXT[S.next][0]:null,noneText:S.noneText,
  sentence:sentence(),marked:sentenceMarked(),match:S.match,nones:S.nones,times:S.times,order:S.order,
  seqNo:S.doneList.length+1,seqTotal:S.extra?null:S.seq.length,extra:S.extra};
 const kept=lsSet(K.q,[...lsGet(K.q,[]),rec]);
 lsSet(K.recent,[rec,...lsGet(K.recent,[])].slice(0,12));addDay();
 S.saved=rec;S.doneList.push(rec);saveState=kept?'saving':'이 휴대폰에 보관하지 못했다. 보내기를 시도한다';S.step=7;render();
 const r=await flush();
 const stillHere=lsGet(K.q,[]).some(x=>x.id===rec.id);
 if(!stillHere)saveState='ok';
 else if(r&&r.pw)saveState='비밀번호가 바뀌었다. 다음에 열 때 새 비밀번호를 넣으면 보관된 기록을 보낸다';
 else saveState='인터넷이 안 돼서 이 휴대폰에 보관했다. 다음에 열 때 자동으로 보낸다';
 if(S.step===7||S.step===8){soft=true;render();soft=false;} // 보낸 결과로 다시 그릴 때 누름을 막지 않는다
}

// 열 때·다시 화면에 돌아올 때 보관된 기록을 보낸다
addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')flush().then(()=>{if(S.step===0)render();});});
addEventListener('online',()=>flush().then(()=>{if(S.step===0)render();}));
// 시작 화면: 열 때마다 보이고(사용자 결정 2026-11-13), 누르면 바로 닫힌다
function splash(){
 const g='<svg viewBox="0 0 300 200" aria-hidden="true"><rect x="2" y="2" width="296" height="196" rx="14" fill="var(--grass)"/>'
  +'<rect class="dr" style="--len:880;--t:.35s;--d:.5s" x="20" y="20" width="260" height="160" rx="4" fill="none" stroke="var(--chalk)" stroke-width="3"/>'
  +'<line class="dr" style="--len:160;--t:.45s;--d:.3s" x1="150" y1="20" x2="150" y2="180" stroke="var(--chalk)" stroke-width="3"/>'
  +'<circle class="dr" style="--len:190;--t:.5s;--d:.4s" cx="150" cy="100" r="30" fill="none" stroke="var(--chalk)" stroke-width="3"/>'
  +'<rect class="dr" style="--len:210;--t:.55s;--d:.3s" x="20" y="65" width="35" height="70" fill="none" stroke="var(--chalk)" stroke-width="3"/>'
  +'<rect class="dr" style="--len:210;--t:.55s;--d:.3s" x="245" y="65" width="35" height="70" fill="none" stroke="var(--chalk)" stroke-width="3"/>'
  +'<g class="ball"><circle cx="150" cy="100" r="9" fill="#fff" stroke="var(--ink)" stroke-width="1.5"/><path d="M150 94l4 3-1.5 5h-5L146 97z" fill="var(--ink)"/></g></svg>';
 const el=document.createElement('div'); el.id='splash';
 el.innerHTML=g+'<p class="st">오늘('+todayKo()+')의 장면 기록</p><p class="ss">오늘 기억나는 장면</p>';
 document.body.appendChild(el);
 let done=false; const close=()=>{if(done)return;done=true;el.classList.add('out');lockUntil=performance.now()+350;setTimeout(()=>el.remove(),300);};
 el.addEventListener('click',e=>{e.stopPropagation();close();});
 setTimeout(close,matchMedia('(prefers-reduced-motion: reduce)').matches?700:1700);
}
splash();
render(); flush().then(()=>{if(S.step===0)render();});
if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
