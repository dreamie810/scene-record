<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오늘의 장면 기록</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="장면 기록">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F6FA">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<!-- R14: 화면용 한글 글꼴 Pretendard (공개 무료). 인터넷이 안 되면 기기 기본 글꼴 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<!-- 작성: AI 초안 (claude-opus-5-5, 2026-11-12, R08 2026-11-13) / 검토: 미검토
     R08: 질문은 files/질문트리/03_코드북.md(장면)·03b_까닭_코드북.md(까닭·다음)에서만 가져온다
     기록앱 R04 = B 방식(설치형 웹 앱). 화면은 R03과 같고 저장만 바뀜
     저장: 먼저 휴대폰에 보관 → 구글 시트(Apps Script)로 보냄 → 성공하면 보관함에서 지움. 같은 id는 시트가 한 번만 적음
     첫 실행: 비밀번호 입력(시트 쪽 스크립트 속성 PASSWORD 와 맞아야 함). 비밀번호는 이 코드에 없다
     분류 항목은 가안. 기준표(FIFA 리포트 등)가 나오면 교체 -->
<style>
/* 한 줄 세로 흐름: 휴대폰 한 손 조작, 큰 버튼, 단계마다 한 질문 */
:root{
  --bg:#F3F6FA; --card:#FFFFFF; --ink:#1C2733; --muted:#66727F; --line:#DFE5EC;
  --accent:#3B7BC8;--grass:#E3F1E8;--chalk:#FFFFFF; --accent-ink:#FFFFFF; --accent-soft:#E6EFFA;
  --good:#2C8F62; --good-soft:#E3F3EB; --bad:#C9673F; --bad-soft:#F8E9E2; --warn:#9A6300; --warn-soft:#FFF3D6;
  --f-body:'Pretendard',-apple-system,'Apple SD Gothic Neo',system-ui,-apple-system,sans-serif; --f-head:'Pretendard',-apple-system,'Apple SD Gothic Neo',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141A21; --card:#1D252E; --ink:#E8EDF2; --muted:#9AA6B2; --line:#2E3946;
  --accent:#6AA3E6;--grass:#1E3328;--chalk:#CFE3D6; --accent-ink:#0E1620; --accent-soft:#22324A;
  --good:#5CC292; --good-soft:#1E3329; --bad:#E49470; --bad-soft:#3A271F; --warn:#F0C060; --warn-soft:#3A3120; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:480px;margin:0 auto;padding-block:max(14px, env(safe-area-inset-top, 0px)) 0;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:12px;min-height:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top b{font-family:var(--f-head);font-size:17px}
.top .date{font-size:13px;color:var(--muted)}
.dots{display:flex;gap:5px}
.dots i{width:20px;height:5px;border-radius:5px;background:var(--line)}
.dots i.on{background:var(--accent)}
.crumb{display:flex;flex-wrap:nowrap;gap:6px;min-height:26px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.crumb::-webkit-scrollbar{display:none}.crumb span{flex:0 0 auto;white-space:nowrap}
.crumb span{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.q{font-family:var(--f-head);font-size:22px;font-weight:700;margin:4px 0 0;text-wrap:balance}
.qs{font-size:14px;color:var(--muted);margin:2px 0 6px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{width:100%;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px 16px;text-align:left;font:inherit;font-size:18px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:56px;transition:transform .08s}
.opt:active{transform:scale(.97)}
/* R31(2026-11-17, 사용자 「누를 때 누르고 있다는 느낌」): 누르는 동안 박스 색을 짙게. 아이폰은 아래 touchstart 덕에 :active가 걸린다 */
:root{--press:brightness(.88)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--press:brightness(1.35)}}
:root[data-theme="dark"]{--press:brightness(1.35)}
.opt,.btn,.addmate{transition:transform .08s,filter .08s}
.opt:active,.btn:active,.addmate:active{filter:var(--press);transform:scale(.97)}
.opt small{display:block;font-size:14px;margin-top:2px;color:var(--muted);font-weight:500}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.none{border-style:dashed;color:var(--muted);font-size:16px;font-weight:600;min-height:50px}
.opt.good{border-color:var(--good)}
.opt.bad{border-color:var(--bad)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opts.g2 .opt{min-height:76px;padding:12px 14px}.opts.g2 .opt>span:last-child{display:none}.opts.g2 .opt.none{grid-column:1/-1;min-height:50px}
.cond{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cond .opt{justify-content:center;padding:0;font-size:22px;min-height:60px}
.opts.dense{gap:6px}.opts.dense .opt{min-height:48px;padding:10px 16px}.opts.dense .opt.none{min-height:44px}
.score{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.score .opt{justify-content:center;padding:0;font-size:20px;min-height:56px}
.lbl{font-size:13.5px;font-weight:700;color:var(--muted);margin:0}
.sentence{background:var(--accent-soft);border-radius:16px;padding:12px 16px;font-size:18px;font-weight:700;line-height:1.6;color:var(--ink)}
.feel input{width:100%;accent-color:var(--accent);height:44px;-webkit-appearance:none;appearance:none;background:transparent}
.feel input::-webkit-slider-runnable-track{height:10px;border-radius:10px;background:var(--line)}
.feel input::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:var(--accent);border:3px solid var(--card);box-shadow:0 1px 4px rgba(0,0,0,.25);margin-top:-12px}
.feel input::-moz-range-track{height:10px;border-radius:10px;background:var(--line)}
.feel input::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--accent);border:3px solid var(--card)}
.feel input.untouched{opacity:.4}
.ends{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);font-weight:700}
.fv{margin:2px 0 0;text-align:center;font-family:var(--f-head);font-size:22px;font-weight:700}
.foot:empty{display:none}
.foot{margin-top:auto;display:flex;gap:8px;padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px));position:sticky;bottom:0;background:var(--bg);box-shadow:0 -10px 12px -12px rgba(0,0,0,.25);z-index:2}
.btn{border:0;border-radius:14px;padding:15px 0;font:inherit;font-weight:700;font-size:16px;cursor:pointer;flex:1;min-height:52px}
.btn.back{background:var(--line);color:var(--ink);flex:0 0 96px}
.btn.go{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.35;cursor:default}
.link{border:0;background:none;color:var(--accent);font:inherit;font-weight:700;text-decoration:underline;padding:0 6px;min-height:44px;cursor:pointer}
.done{text-align:center;font-size:44px;line-height:1;margin:6px 0 0}
.state{font-size:15px;border-radius:12px;padding:12px 14px;margin:0}
.state.ok{background:var(--good-soft);color:var(--good)}
.state.warn{background:var(--warn-soft);color:var(--warn)}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px}
/* 끝 화면 요약: 이름표는 작게, 값은 크게 (R07) */
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;text-align:center}
.stat span{display:block;font-size:13px;color:var(--muted);font-weight:700}
.stat b{display:block;font-size:22px;font-weight:700;margin-top:2px}
.item .m{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
input.pw.nonein{font-size:17px;letter-spacing:0;border-color:var(--accent)}
input.pw{width:100%;font:inherit;font-size:20px;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);letter-spacing:.1em}
.err{color:var(--bad);font-size:14px;font-weight:700;min-height:22px;margin:0}
/* 시작 화면 (R06): 하루 첫 실행 때 약 1.3초, 누르면 바로 넘어감 */
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .25s}
#splash.out{opacity:0;pointer-events:none}
#splash svg{width:min(78vw,300px)}
#splash .st{font-size:26px;font-weight:700;letter-spacing:-.5px;margin:22px 0 0;opacity:0;transform:translateY(8px);animation:spUp .45s .75s ease-out forwards}
#splash .ss{font-size:14px;color:var(--muted);margin:6px 0 0;opacity:0;animation:spUp .45s .85s ease-out forwards}
#splash .dr{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:spDraw var(--d) var(--t) ease-out forwards}
#splash .ball{transform:translate(-160px,0) rotate(-360deg);transform-origin:150px 100px;animation:spRoll .55s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes spUp{to{opacity:1;transform:none}}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spRoll{to{transform:none}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}
/* R11: 고른 보기는 진한 색 + ✓, 「다음」은 보기 바로 아래 */
.opt.sel{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.opt.sel small{color:var(--accent-ink);opacity:.9}
.opt.good.sel{border-color:var(--good);background:var(--good);color:#fff}
.opt.bad.sel{border-color:var(--bad);background:var(--bad);color:#fff}
.opt.none.sel{border-style:solid;color:var(--accent-ink)}
.ck{font-size:18px;font-weight:700;flex:0 0 auto;margin-left:6px}
.num{font-size:22px;font-weight:700;flex:0 0 auto}
.opts.g2 .opt{position:relative}.opts.g2 .opt .num{position:absolute;top:6px;right:10px}.opts.g2 .opt>span:first-child,.opts.g2 .opt>span.num{display:block}
.nextbtn{width:100%;flex:none;margin-top:4px}
.foot .nextbtn{flex:1 1 0;width:auto;min-width:0;margin-top:0}
.foot:has(.nextbtn) .btn.back{flex:0 0 auto!important;padding:15px 16px;white-space:nowrap}
.btn.back.wide{width:100%;flex:none}
.crumb span{background:var(--accent);color:var(--accent-ink)}
.crumb .seq{background:var(--ink);color:var(--bg)}
/* R12 주간 기록 카드: 칸이 차례로 차고, 오늘 칸이 튀어 오른다 */
.wk{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;text-align:center}
.wk-t{margin:0;font-size:15px;font-weight:700;color:var(--muted)}.wk-t b{font-size:28px;color:var(--good);margin:0 2px;font-variant-numeric:tabular-nums}
.wk-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0 6px}
.wk-c{display:flex;flex-direction:column;align-items:center;gap:3px}.wk-c small{font-size:12px;color:var(--muted);font-weight:700}
.wk-d{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:16px}
.wk-d.on{background:var(--good);border-color:var(--good)}
.wk-d.fut{border-style:dashed;opacity:.5}
.wk-m{margin:0;font-size:16px;font-weight:700;color:var(--ink)}
.wk.anim .wk-d.on{animation:wkPop .45s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i)*.12s + .2s)}
.wk.anim .wk-d.now{animation:wkPop .55s cubic-bezier(.3,1.6,.5,1) both,wkRing 1.2s 1.2s ease-out 2;animation-delay:calc(var(--i)*.12s + .35s),calc(var(--i)*.12s + .9s)}
.wk.anim .wk-m{animation:wkUp .5s ease-out both;animation-delay:1.3s}
@keyframes wkPop{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes wkRing{0%{box-shadow:0 0 0 0 rgba(44,143,98,.55)}100%{box-shadow:0 0 0 14px rgba(44,143,98,0)}}
@keyframes wkUp{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.wk.anim *{animation:none!important}}
.wk-mini{font-size:13.5px;font-weight:700;color:var(--good);margin:0}
.pk{color:var(--accent);font-weight:700;letter-spacing:.02em}.pk.good{color:var(--good)}.pk.bad{color:var(--bad)}
.sentence{font-weight:500}.item{line-height:1.6}
.tx{width:100%;font:inherit;font-size:17px;line-height:1.5;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);resize:none;box-sizing:border-box}
.tcard{border-radius:16px;padding:12px 16px}.tcard p{margin:2px 0;line-height:1.55;font-size:16.5px}.tcard.good{background:rgba(22,163,74,.10)}.tcard.ask{background:var(--accent-soft)}
.tlbl{font-size:13.5px!important;font-weight:700;color:var(--muted);margin:0 0 4px!important}.tq{font-size:18px!important;font-weight:700}
/* R19 잠금 화면. 출처: github.com/dreamie810/team-dash-src  files/디자인시안/make_sian.py LAYERS["lockcss"]  (커밋 83a91ff). 색은 이 앱 토큰으로 */
html.locked .wrap{visibility:hidden}
#lockv{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);padding:16px}
.lk{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 22px;display:flex;flex-direction:column;gap:12px;text-align:center}
.lk-t{font:700 22px/1.3 var(--f-head)} .lk-s{color:var(--muted);font-size:14px}
.lk input[type=password]{width:100%;font:inherit;font-size:20px;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.lk input[type=password]:focus{outline:none;border-color:var(--accent)}
.lk-r{color:var(--muted);font-size:14px;display:flex;gap:6px;align-items:center;justify-content:center;min-height:44px}
.lk-b{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:15px;font:700 16px var(--f-body);cursor:pointer;min-height:52px}
.lk-b:disabled{opacity:.5}
.lk-e{color:var(--bad);font-size:14px;font-weight:700;min-height:1.2em}
/* R19 명단에서 고르기 */
.rgrp{font-size:13.5px;font-weight:700;color:var(--muted);margin:8px 0 2px}
.rlist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rlist .opt{min-height:52px;padding:10px 12px;font-size:17px}
.rlist .opt small{display:inline;margin:0 6px 0 0;font-size:13px}
/* R20 변화 한 줄 (판정 없이 나란히) */
.homeopts{display:flex;flex-direction:column;gap:12px}
.opt.home{min-height:128px;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:2px;font-size:22px;border-radius:20px}
.opt.home.sc{background:var(--good-soft);border-color:var(--good)}.opt.home.sc>span:not(.hico){color:var(--good)}
.opt.home.mt{background:var(--accent-soft);border-color:var(--accent)}.opt.home.mt>span:not(.hico){color:var(--accent)}
.opt.home .hico{font-size:40px;line-height:1.1}.opt.home small{font-size:15px;margin-top:2px;max-width:280px}
.opt.sq{min-height:140px;font-size:34px;justify-content:center;flex-direction:column;gap:2px}.opt.sq small{font-size:15px}
/* R30(2026-11-17, 사용자 「팀 고르기도 색 구분」): U-15 노랑, U-18 파랑 */
.opt.sq.u15{background:var(--warn-soft);border-color:var(--warn)}.opt.sq.u15>span{color:var(--warn)}
.opt.sq.u18{background:var(--accent-soft);border-color:var(--accent)}.opt.sq.u18>span{color:var(--accent)}
.rlist .opt.has{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.rlist .opt .cc{display:block;font-size:12.5px;color:var(--accent);font-weight:700}
.pab{font-size:22px;letter-spacing:.02em}
.addmate{align-self:center;border:0;background:none;color:var(--muted);font:inherit;font-size:14.5px;font-weight:600;text-decoration:underline;min-height:44px;padding:0 12px;cursor:pointer;margin-top:4px}
.chg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:0;font-size:15px;line-height:1.6}
</style>
</head>
<body>

    const s=document.createElement('script');s.textContent=o.main;document.body.appendChild(s);}
  // R22: 판을 바꾸면 소금이 바뀌어 기억된 열쇠가 맞지 않는다. 그때는 이 휴대폰에 저장된 비밀번호(시트 보내기용 scene_pw_v1, R17부터 저장)로
  //   새 판을 열고 열쇠를 새로 기억한다. 비밀번호가 바뀌었으면 풀리지 않으므로 잠금 화면으로 간다 (사용자 2026-11-16 「판을 바꿀 때 다시 묻지 않게」)
  async function tryStored(P){
    try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);
      if(o.s===P.s){run(await dec(await crypto.subtle.importKey('raw',b64(o.k),'AES-GCM',true,['decrypt']),P));return true;}}}catch(e){}
    try{const pw=JSON.parse(localStorage.getItem(PWK)||'null');if(!pw)return false;
      const key=await derive(pw,P),o=await dec(key,P);
      try{localStorage.setItem(KEY,JSON.stringify({s:P.s,k:u64(await crypto.subtle.exportKey('raw',key))}));}catch(e){}
      run(o);return true;}catch(e){return false;}}
  async function unlock(pw,remember){const P=JSON.parse(D().textContent);let key,o;
    try{key=await derive(pw,P);o=await dec(key,P);}catch(e){return false;}
    try{localStorage.setItem(PWK,JSON.stringify(pw));}catch(e){}
    if(remember)try{localStorage.setItem(KEY,JSON.stringify({s:P.s,k:u64(await crypto.subtle.exportKey('raw',key))}));}catch(e){}
    run(o);return true;}
  window.lockForget=()=>{try{localStorage.removeItem(KEY);}catch(e){}location.reload();};
  document.addEventListener('DOMContentLoaded',async()=>{
    if(!enc())return;
    document.documentElement.classList.add('locked');
    document.body.insertAdjacentHTML('beforeend',`<div id="lockv"><form class="lk"><div class="lk-t">오늘의 장면 기록</div><div class="lk-s">아빠에게 받은 비밀번호를 넣는다. 이 휴대폰 안에서만 연다</div>
      <input id="lkpw" type="password" autocomplete="current-password" placeholder="비밀번호" aria-label="비밀번호">
      <label class="lk-r"><input id="lkrem" type="checkbox" checked> 이 휴대폰에서 기억</label>
      <button class="lk-b" type="submit">열기</button><div class="lk-e" id="lkerr"></div></form></div>`);
    const P=JSON.parse(D().textContent);
    if(await tryStored(P))return;
    const f=document.querySelector('#lockv form');document.getElementById('lkpw').focus();
    f.onsubmit=async ev=>{ev.preventDefault();const b=f.querySelector('button');b.disabled=true;b.textContent='여는 중…';
      const ok=await unlock(document.getElementById('lkpw').value,document.getElementById('lkrem').checked);
      if(!ok){b.disabled=false;b.textContent='열기';document.getElementById('lkerr').textContent='비밀번호가 맞지 않는다';document.getElementById('lkpw').select();}};
  });
})();
</script>
